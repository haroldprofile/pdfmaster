name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: https://pdfmaster-backend-thhj.onrender.com
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Email on Failure
        if: needs.build.result != 'success' || needs.deploy.result != 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ PDFMaster Deployment Failed"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions <no-reply@github.com>
          body: "The PDFMaster deployment has failed for commit ${{ github.sha }} (build: ${{ needs.build.result }}, deploy: ${{ needs.deploy.result }}). Check the actions run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send Email on Success
        if: needs.build.result == 'success' && needs.deploy.result == 'success'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ PDFMaster Deployment Succeeded"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions <no-reply@github.com>
          body: "The PDFMaster deployment has completed successfully. Your site is live: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
